#
# Technoplatz BI - TLS overlay
#
# Traefik obtains and renews a certificate for ${DOMAIN} from Let's Encrypt (TLS-ALPN challenge on
# port ${HTTPS_PORT}), serves the api and the web application on https only and redirects http.
# Requires a public DNS name for DOMAIN, ACME_EMAIL in .env and ports 80/443 reachable. Use it on
# top of the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The command list below replaces the one in docker-compose.yml, so it repeats the base options.
#
services:
  traefik:
    command:
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:${HTTP_PORT}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:${HTTPS_PORT}
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    volumes:
      - bi-acme-volume:/letsencrypt
  api:
    labels:
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=letsencrypt
  pwa:
    labels:
      - traefik.http.routers.pwa.entrypoints=websecure
      - traefik.http.routers.pwa.tls=true
      - traefik.http.routers.pwa.tls.certresolver=letsencrypt

volumes:
  bi-acme-volume:
    driver: local
    name: bi-acme-volume
