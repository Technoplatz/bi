#
# Technoplatz BI - docker secrets overlay
#
# Keeps the credentials out of the container environment: each secret is a file under ./secrets
# (git-ignored) mounted at /run/secrets/<name>; the services read the file when it is mounted and
# fall back to the environment variable otherwise. Use it on top of the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The MongoDB members and the bootstrap job still take their credentials from the environment.
#
secrets:
  mongo_password:
    file: ./secrets/mongo_password
  mongo_tls_cert_keyfile_password:
    file: ./secrets/mongo_tls_cert_keyfile_password
  smtp_password:
    file: ./secrets/smtp_password
  integration_api_key:
    file: ./secrets/integration_api_key

services:
  api:
    secrets: [mongo_password, mongo_tls_cert_keyfile_password, smtp_password, integration_api_key]
  scheduler:
    secrets: [mongo_password, mongo_tls_cert_keyfile_password, smtp_password, integration_api_key]
  stream:
    secrets: [mongo_password, mongo_tls_cert_keyfile_password, smtp_password]
